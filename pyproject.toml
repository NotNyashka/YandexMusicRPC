[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-music-rpc"
version = "0.2.2"
description = "Shows the current Yandex Music track in Discord Rich Presence on Windows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Elizabeth Collins" }]
dependencies = [
  "Pillow>=10.4,<12",
  "platformdirs>=4.3,<5",
  "pypresence>=4.6,<5",
  "pystray>=0.19,<1",
  "winsdk>=1.0.0b10; sys_platform == 'win32'",
  "yandex-music>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pyinstaller>=6.10,<7", "ruff>=0.8,<1"]

[project.scripts]
yandex-music-rpc = "ymrpc.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
  "BLE001", # application boundaries must survive third-party IPC/API errors
  "S110",   # closing Discord IPC is best-effort during shutdown
]
